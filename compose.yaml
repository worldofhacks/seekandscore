name: seekandscore

x-safe-runtime: &safe-runtime
  APP_ENV: development
  DATASET_MODE: live
  INGESTION_ENABLED: "false"
  LIVE_SOURCE_DISPLAY_ENABLED: "false"
  ALERT_DELIVERY_MODE: log
  OUTREACH_MODE: disabled
  OUTREACH_SEND_ENABLED: "false"

x-python-service: &python-service
  profiles: [app]
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    <<: *safe-runtime
    DATABASE_URL: postgresql+psycopg://seekandscore:seekandscore@postgis:5432/seekandscore
    REDIS_URL: redis://redis:6379/0
    OBJECT_STORAGE_ENDPOINT: http://minio:9000
    OBJECT_STORAGE_REGION: us-east-1
    OBJECT_STORAGE_BUCKET: seekandscore-raw-dev
    OBJECT_STORAGE_ACCESS_KEY_ID: seekandscore
    OBJECT_STORAGE_SECRET_ACCESS_KEY: seekandscore-local-only
    OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
    OBJECT_STORAGE_PREFIX: raw-artifacts
    INGESTION_CONFIG_PATH: config/ingestion/us-tx-central-texas-v1.yaml
    INGESTION_SOURCE_ID: travis_tcad_parcels
    INGESTION_RUN_PROFILE: proof
    INGESTION_PAGE_SIZE: "2"
    INGESTION_MAX_RECORDS: "2"
    INGESTION_CITIES: DEL VALLE,MANOR
    INGESTION_HTTP_TIMEOUT_SECONDS: "30"
    INGESTION_MIN_REQUEST_INTERVAL_SECONDS: "1"
    INGESTION_MAX_RETRIES: "3"
    INGESTION_WHERE: PROP_ID IS NOT NULL AND tcad_acres >= 1
    INGESTION_ORDER_BY: OBJECTID ASC
    RAW_ARTIFACT_ROOT: /data/raw-artifacts
  depends_on:
    postgis:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  networks: [backend]

services:
  postgis:
    image: postgis/postgis:17-3.5
    # The upstream image is amd64-only; Docker Desktop emulates it on Apple silicon.
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_DB: seekandscore
      POSTGRES_USER: seekandscore
      POSTGRES_PASSWORD: seekandscore
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:${POSTGIS_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U seekandscore -d seekandscore"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: seekandscore
      MINIO_ROOT_PASSWORD: seekandscore-local-only
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: seekandscore
      MINIO_ROOT_PASSWORD: seekandscore-local-only
      OBJECT_STORAGE_BUCKET: seekandscore-raw-dev
    volumes:
      - ./scripts/dev/init-object-storage.sh:/usr/local/bin/init-object-storage:ro
    entrypoint: [/bin/sh, /usr/local/bin/init-object-storage]
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *python-service
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: [python, -m, seekandscore.api]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *python-service
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: [python, -m, seekandscore.worker, --queues, acquire,parse,resolve,geo,market,score,deliver]
    stop_grace_period: 60s

  ingestion-travis:
    <<: *python-service
    profiles: [ingestion]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: [python, -m, seekandscore.ingestion, run, --source, travis_tcad_parcels]
    restart: "no"

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_ENV: development
      DATASET_MODE: live
      WEB_PRIVATE_ACCESS_ENABLED: "false"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  postgis-data:
  redis-data:
  minio-data:
