[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/web.Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/ui/**",
  "packages/contracts/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "infra/docker/web.Dockerfile",
  "scripts/runtime/web-entrypoint.sh"
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
overlapSeconds = 15
drainingSeconds = 20
