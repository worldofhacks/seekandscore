[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/worker.Dockerfile"
watchPatterns = [
  "services/worker/**",
  "python/seekandscore/**",
  "config/regions/**",
  "config/ingestion/**",
  "pyproject.toml",
  "uv.lock",
  "infra/docker/worker.Dockerfile",
  "scripts/runtime/**"
]

[deploy]
startCommand = "/app/scripts/runtime/database-role-entrypoint.sh unprovisioned python -m seekandscore.scheduler dispatch-due"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
