[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/worker.Dockerfile"
watchPatterns = [
  "services/worker/**",
  "python/seekandscore/**",
  "migrations/**",
  "pyproject.toml",
  "uv.lock",
  "infra/docker/worker.Dockerfile",
  "scripts/runtime/python-entrypoint.sh"
]

[deploy]
startCommand = "/app/scripts/runtime/python-entrypoint.sh python -m seekandscore.worker --queues acquire,parse"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
drainingSeconds = 60
