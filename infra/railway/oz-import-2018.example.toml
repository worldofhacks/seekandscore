[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/worker.Dockerfile"
watchPatterns = [
  "python/seekandscore/acquisition/**",
  "python/seekandscore/geography/opportunity_zones/**",
  "python/seekandscore/db/roles.py",
  "config/sources/us/federal/qualified-opportunity-zones-2018.yaml",
  "migrations/**",
  "pyproject.toml",
  "uv.lock",
  "infra/docker/worker.Dockerfile",
  "infra/railway/oz-import-2018.example.toml",
  "scripts/runtime/**"
]

[deploy]
# Manual, full frozen-layer import only. The import gate must be exact or this
# command exits before contacting CDFI. Re-run unchanged once for replay.
startCommand = "/app/scripts/runtime/database-role-entrypoint.sh oz-importer python -m seekandscore.geography.opportunity_zones run"
restartPolicyType = "NEVER"
